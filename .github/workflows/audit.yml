name: Security audit

on:
  push:
    paths: [Cargo.toml, Cargo.lock]
  pull_request:
    paths: [Cargo.toml, Cargo.lock]
  schedule:
    - cron: "23 7 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: rustsec/audit-check@v2.0.0
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
