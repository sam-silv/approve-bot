name: Bug report
description: Report a reproducible problem (not a security vulnerability).
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: Never include Slack or GitHub credentials. Report vulnerabilities privately through GitHub Security Advisories.
  - type: input
    id: version
    attributes:
      label: Version
      placeholder: v0.1.0 or commit SHA
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: What happened?
      description: Include sanitized logs and reproduction steps.
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: dropdown
    id: deployment
    attributes:
      label: Deployment
      options: [Docker Compose, Docker, Native binary, Other]
    validations:
      required: true
