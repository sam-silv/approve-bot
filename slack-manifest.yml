display_information:
  name: approve-bot
  description: Approve trusted GitHub pull requests from Slack.
  background_color: "#172033"
features:
  bot_user:
    display_name: approve-bot
    always_online: false
oauth_config:
  scopes:
    bot:
      - app_mentions:read
      - chat:write
      - im:history
settings:
  event_subscriptions:
    request_url: https://YOUR_HOST/slack/events
    bot_events:
      - app_mention
      - message.im
  interactivity:
    is_enabled: false
  org_deploy_enabled: false
  socket_mode_enabled: false
  token_rotation_enabled: false
